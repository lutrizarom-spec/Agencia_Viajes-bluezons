services:
  api:
    build: .
    environment:
      AGENCIA_JWT_SECRET: ${AGENCIA_JWT_SECRET:?Copia .env.example a .env y define un secreto de al menos 32 bytes}
      AGENCIA_DB_PATH: /data/agencia.db
    volumes:
      - agencia_data:/data
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build: ./frontend
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8080:80"
    restart: unless-stopped

volumes:
  agencia_data:
